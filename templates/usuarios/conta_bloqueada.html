{% extends "base.html" %}

{% block titulo %}Conta Bloqueada{% endblock %}

{% block conteudo %}
<div class="flex items-center justify-center min-h-screen px-4">
    <div class="w-full max-w-md bg-white rounded-lg shadow-md p-8 text-center">
        <div class="text-red-500 text-5xl mb-4">&#9888;</div>
        <h2 class="text-2xl font-bold text-gray-800 mb-4">Conta Bloqueada</h2>
        <p class="text-gray-600 mb-6">
            Sua conta está desativada. Entre em contato com o suporte para reativá-la.
        </p>
        <form method="post" action="{% url 'usuarios:logout' %}" class="inline">
            {% csrf_token %}
            <button type="submit" class="inline-block py-2 px-6 bg-gray-600 text-white rounded-lg hover:bg-gray-700 transition">
                Sair
            </button>
        </form>
    </div>
</div>
{% endblock %}
